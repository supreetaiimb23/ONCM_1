# Database migrations. The app runs them on start (app/migrate.py); by hand:
#   .venv/bin/alembic upgrade head                           apply
#   .venv/bin/alembic revision --autogenerate -m "what"      after changing app/models.py, then review the file
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
